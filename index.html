<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Sample App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            text-align: center;
            padding-top: 100px;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to DevOps Lab</h1>
        <p>This is a sample web application.</p>
        <p>Developed and managed using Git and GitHub.</p>
        <button onclick="showAlert()">Click Here</button>
    </div>

    <script>
        function showAlert() {
            alert("Button clicked successfully! Your DevOps environment is working.");
        }
    </script>
</body>
</html>
